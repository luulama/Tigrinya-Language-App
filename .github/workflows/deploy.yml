name: Deploy approved release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 scripts/prepare_web_preview.py
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build and deploy immutable images
        env:
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          ACR_NAME: ${{ vars.ACR_NAME }}
          API_APP: ${{ vars.API_APP }}
          WEB_APP: ${{ vars.WEB_APP }}
          MIGRATION_JOB: ${{ vars.MIGRATION_JOB }}
          API_URL: ${{ vars.API_URL }}
        run: bash infrastructure/github/deploy.sh
